    github: OrelSokolov/active_job.cr
    version: ~> 0.1.0
  action_mailer_cr:
    github: OrelSokolov/action_mailer.cr
    version: ~> 0.1.0
  action_pack_cr:
    github: OrelSokolov/action_pack.cr
    version: ~> 0.1.0
